services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_fundamentos_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000

  # (Opcional) Si deseas levantar una base de datos PostgreSQL local en lugar de la nube (Neon):
